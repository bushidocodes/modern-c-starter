name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14 and clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-14 clang-format

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Format check
        run: make format-check

      - name: Address & UB sanitizers
        run: make asan
